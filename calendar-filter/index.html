<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar Filter</title>
    <!-- Start-up, reload recovery and error reporting (shared/boot.js). -->
    <script src="../shared/boot.js?v=274c7f0929" data-lib="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" data-mock="./dev/mock.js?v=4111f65587" data-name="Calendar Filter" data-ext-version="1.0.0"></script>
    <link rel="preload" as="script" href="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" />
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=ab949029bd" />
    <link rel="stylesheet" href="./chart.css?v=ba863640cb" />
    <script src="../shared/timing.js?v=666dc99b7c"></script>
    <script src="../shared/core.js?v=12ed79da06"></script>
    <script src="./config.js?v=125a833bf0"></script>
    <script src="./chart.js?v=4b06b725cf"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div id="title" class="title" style="display:none"></div>
      <div id="box" class="box" role="button" tabindex="0" aria-haspopup="dialog">
        <svg id="boxIcon" class="box-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>
        <span id="boxText" class="box-text is-placeholder">All dates</span>
        <span id="boxClear" class="box-clear" role="button" title="Clear the filter" aria-label="Clear the filter" style="display:none">×</span>
        <svg class="box-caret" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div id="notice" class="notice" role="status" style="display:none"></div>
      <div id="hint" class="hint"></div>
    </div>

    <script>
      if (window.ExtBoot) {
        ExtBoot.start(function () { if (!window.CalendarFilter) return false; window.CalendarFilter.init(); return true; });
      } else {
        (function () {
          var n = +((/extRetry=(\d+)/.exec(location.hash) || [0, 0])[1]);
          if (n < 3) { location.hash = 'extRetry=' + (n + 1); location.reload(); }
          else document.getElementById('hint').textContent = 'Could not load the Calendar Filter files. Refresh the page to try again.';
        })();
      }
    </script>
  </body>
</html>
