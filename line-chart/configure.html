<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Line Chart — Format</title>
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./configure.css?v=1242cd3374" />
  </head>

  <body>
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="body" id="panels"></main>

    <footer class="footer">
      <button class="btn" id="reset-tab" type="button" title="Restore the defaults for this tab">Reset tab</button>
      <span class="status" id="status"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="done" type="button">Done</button>
    </footer>

    <script src="./icons.js?v=899a3f9c7f"></script>
    <script src="./config.js?v=ff37e1e0a8"></script>
    <script src="./configure.js?v=9f7243352b"></script>
    <script>
      if (/[?&]mock\b/.test(location.search)) document.write('<script src="./dev/mock.js?v=db3141287c"><\/script>');
    </script>
    <script>
      // Tableau Extensions API is bundled in ./lib (no CDN). Skipped when a dev mock already defined it.
      if (!(window.tableau && window.tableau.extensions)) {
        document.write('<script src="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7"><\/script>');
      }
    </script>
    <script>
      if (window.tableau && window.tableau.extensions) {
        window.LineChartConfigure.init();
      } else {
        console.error('Could not load the Tableau Extensions API library.');
      }
    </script>
  </body>
</html>
