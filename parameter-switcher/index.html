<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parameter Switcher</title>
    <!-- Start-up, reload recovery and error reporting (shared/boot.js). -->
    <script src="../shared/boot.js?v=274c7f0929" data-lib="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" data-mock="./dev/mock.js?v=f35eeff1e6" data-name="Parameter Switcher" data-ext-version="1.0.0"></script>
    <!-- Start the biggest download (the API library, loaded at the end of body) right away. -->
    <link rel="preload" as="script" href="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" />
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./chart.css?v=73ff02e5cc" />
    <script src="../shared/timing.js?v=666dc99b7c"></script>
    <script src="../shared/core.js?v=2cdac465b4"></script>
    <script src="../shared/snapshot.js?v=b026331aa7"></script>
    <script src="./icons.js?v=6a0dce9bfa"></script>
    <script src="./config.js?v=9114d2ebf3"></script>
    <script src="./chart.js?v=3162357092"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div class="head">
        <div id="icon" class="icon" aria-hidden="true"></div>
        <div id="title" class="title"></div>
        <div id="explanation" class="explanation"></div>
      </div>

      <div id="control" class="control" role="group"></div>
      <div id="msg" class="msg" role="alert" style="display:none"></div>

      <div id="hint" class="hint"></div>
    </div>

    <script>
      // boot.js loads the Tableau API library (and the dev mock with ?mock), then starts the extension.
      if (window.ExtBoot) {
        ExtBoot.start(function () { if (!window.ParameterSwitcher) return false; window.ParameterSwitcher.init(); return true; });
      } else {
        // boot.js itself did not arrive: reload this frame, up to 3 times.
        (function () {
          var n = +((/extRetry=(\d+)/.exec(location.hash) || [0, 0])[1]);
          if (n < 3) { location.hash = 'extRetry=' + (n + 1); location.reload(); }
          else document.getElementById('hint').textContent = 'Could not load the Parameter Switcher files. Refresh the page to try again.';
        })();
      }
    </script>
  </body>
</html>
