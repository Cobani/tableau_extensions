<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parameter Switcher — dev preview</title>
<style>
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #263244; background: #eef0f2; }
  .bar { display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e4e8; flex-wrap: wrap; }
  .bar b { font-size: 14px; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .zone { resize: both; overflow: hidden; width: 420px; height: 120px; background: #fff; border: 1px solid #d5d9df; }
  .zone iframe, .dlg iframe { width: 100%; height: 100%; border: 0; display: block; }
  .dlg { flex: none; width: 540px; height: 760px; background: #fff; border: 1px solid #d5d9df; box-shadow: 0 6px 24px rgba(0,0,0,.12); display: none; }
  button, select { font: inherit; padding: 4px 10px; }
  .note { color: #68707d; }
</style>
</head>
<body>
  <div class="bar">
    <b>Parameter Switcher — dev preview</b>
    <label>Data
      <select id="data">
        <option value="default">Metric (list of 4, tabs)</option>
        <option value="period">Period (list of 5, pills)</option>
        <option value="toggle">Show targets (2 values, toggle)</option>
        <option value="range">Top N (range, stepper)</option>
        <option value="options">Region (14 on Options tile)</option>
        <option value="many">Region (40 on Options tile)</option>
        <option value="none">No parameter chosen</option>
      </select>
    </label>
    <label>Zone size
      <select id="size">
        <option value="200x120">Small 200 x 120</option>
        <option value="420x120" selected>Medium 420 x 120</option>
        <option value="640x300">Large 640 x 300</option>
        <option value="900x200">Wide 900 x 200</option>
      </select>
    </label>
    <button id="fmt" type="button">Format Extension</button>
    <button id="elsewhere" type="button">Change elsewhere</button>
    <button id="reset" type="button">Reset settings</button>
    <span class="note">Drag the zone's corner to resize. Add ?rejectChange to see a rejected change revert. Add ?debug for timings.</span>
  </div>
  <div class="wrap">
    <div class="dlg" id="dlg"><iframe id="dialog" title="Format dialog"></iframe></div>
    <div class="zone" id="zone"><iframe id="card" title="control"></iframe></div>
  </div>
<script>
  var dataSel = document.getElementById('data');
  var sizeSel = document.getElementById('size');
  var zone = document.getElementById('zone');
  var extra = location.search.replace(/^\?/, '').split('&').filter(function (p) { return /^(failInit|hangInit)=/.test(p); }).join('&');
  try {
    dataSel.value = localStorage.getItem('psMockData') || 'default';
    sizeSel.value = localStorage.getItem('psMockSize') || '420x120';
  } catch (e) {}
  function applySize () {
    var p = sizeSel.value.split('x');
    zone.style.width = p[0] + 'px';
    zone.style.height = p[1] + 'px';
  }
  function load () {
    document.getElementById('card').src = '../index.html?mock&data=' + dataSel.value + (location.search.indexOf('rejectChange') >= 0 ? '&rejectChange' : '') + (extra ? '&' + extra : '') + (/debug/.test(location.search) ? '&debug' : '');
  }
  dataSel.addEventListener('change', function () { localStorage.setItem('psMockData', dataSel.value); closeDlg(); load(); });
  sizeSel.addEventListener('change', function () { localStorage.setItem('psMockSize', sizeSel.value); applySize(); });
  document.getElementById('reset').addEventListener('click', function () { Object.keys(localStorage).filter(function (k) { return k.indexOf('psMockSettings') === 0; }).forEach(function (k) { localStorage.removeItem(k); }); closeDlg(); load(); });
  document.getElementById('elsewhere').addEventListener('click', function () {
    // Sets the first parameter other than the current value from outside the control, like a dashboard action would.
    var w = document.getElementById('card').contentWindow;
    var p = null;
    var name = (function () { try { return JSON.parse(w.tableau.extensions.settings.get('parameterSwitcher1') || '{}').parameter.name; } catch (e) { return ''; } })();
    p = w.mockParameters.find(function (x) { return x.name === name; });
    if (!p) return;
    var av = p.allowableValues;
    var vals = av.type === 'list' ? av.allowableValues.map(function (d) { return d.value; }) : av.type === 'range' ? [av.minValue.value, av.maxValue.value] : ['Eastfield', 'Harbor Bay'];
    var i = vals.indexOf(p.currentValue.value);
    w.mockSetParameter(name, vals[(i + 1) % vals.length]);
  });
  document.getElementById('fmt').addEventListener('click', function () {
    document.getElementById('card').contentWindow.postMessage({ type: 'ps-configure' }, '*');
  });
  function closeDlg () {
    document.getElementById('dlg').style.display = 'none';
    document.getElementById('dialog').src = 'about:blank';
    var c = document.getElementById('card').contentWindow;
    if (c) c.postMessage({ type: 'ps-dialog-closed' }, '*');
  }
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'ps-open-dialog') {
      document.getElementById('dlg').style.display = 'block';
      document.getElementById('dialog').src = e.data.url;
    }
    if (e.data.type === 'ps-close-dialog') closeDlg();
  });
  applySize();
  load();
</script>
</body>
</html>
