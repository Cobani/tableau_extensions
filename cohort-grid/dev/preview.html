<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cohort Grid — dev preview</title>
<style>
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #263244; background: #eef0f2; }
  .bar { display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e4e8; flex-wrap: wrap; }
  .bar b { font-size: 14px; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .zone { resize: both; overflow: hidden; width: 900px; height: 520px; background: #fff; border: 1px solid #d5d9df; }
  .zone iframe, .dlg iframe { width: 100%; height: 100%; border: 0; display: block; }
  .dlg { width: 620px; height: 780px; background: #fff; border: 1px solid #d5d9df; box-shadow: 0 6px 24px rgba(0,0,0,.12); display: none; }
  button, select { font: inherit; padding: 4px 10px; }
  .note { color: #68707d; }
</style>
</head>
<body>
  <div class="bar">
    <b>Cohort Grid — dev preview</b>
    <label>Sample data
      <select id="ds">
        <option value="default">12 monthly cohorts, numeric period</option>
        <option value="dates">Period as a month date</option>
        <option value="weekly">Weekly, 20 x 20, no cohort size</option>
        <option value="small">Small, 4 x 4</option>
        <option value="gaps">Gaps, zeros, a cohort of size 0</option>
        <option value="big">Big, 50 x 50 (row limit note)</option>
        <option value="renamed">Renamed Cohort pill</option>
      </select>
    </label>
    <label><input type="checkbox" id="rename"> Rename the Cohort pill</label>
    <button id="fmt" type="button">Format Extension</button>
    <button id="reset" type="button">Reset settings</button>
    <span class="note">Right-click for the menu, click a cell to select it. Drag the zone's corner to resize.</span>
  </div>
  <div class="wrap">
    <div class="zone"><iframe id="card" title="cohort grid"></iframe></div>
    <div class="dlg" id="dlg"><iframe id="dialog" title="Format dialog"></iframe></div>
  </div>
<script>
  var ds = document.getElementById('ds');
  ds.value = localStorage.getItem('cgMockData') || 'default';
  var rn = document.getElementById('rename');
  rn.checked = localStorage.getItem('cgMockRename') === '1';
  rn.addEventListener('change', function () { localStorage.setItem('cgMockRename', rn.checked ? '1' : '0'); closeDlg(); load(); });
  function load () { document.getElementById('card').src = '../index.html?mock&data=' + ds.value + (rn.checked ? '&rename' : '') + (/debug/.test(location.search) ? '&debug' : ''); }
  ds.addEventListener('change', function () { localStorage.setItem('cgMockData', ds.value); closeDlg(); load(); });
  document.getElementById('reset').addEventListener('click', function () { localStorage.removeItem('cgMockSettings'); closeDlg(); load(); });
  document.getElementById('fmt').addEventListener('click', function () {
    document.getElementById('card').contentWindow.postMessage({ type: 'cg-configure' }, '*');
  });
  function closeDlg () {
    document.getElementById('dlg').style.display = 'none';
    document.getElementById('dialog').src = 'about:blank';
    var c = document.getElementById('card').contentWindow;
    if (c) c.postMessage({ type: 'cg-dialog-closed' }, '*');
  }
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'cg-open-dialog') {
      document.getElementById('dlg').style.display = 'block';
      document.getElementById('dialog').src = e.data.url;
    }
    if (e.data.type === 'cg-close-dialog') closeDlg();
  });
  load();
</script>
</body>
</html>
