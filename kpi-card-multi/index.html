<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI Card Multi</title>
    <!-- Start-up, reload recovery and error reporting (shared/boot.js). -->
    <script src="../shared/boot.js?v=274c7f0929" data-lib="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" data-mock="./dev/mock.js?v=08db380cdd" data-name="KPI Card Multi" data-ext-version="1.2.0"></script>
    <!-- Start the biggest download (the API library, loaded at the end of body) right away. -->
    <link rel="preload" as="script" href="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" />
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./card.css?v=2e37a93b99" />
    <script src="../shared/timing.js?v=666dc99b7c"></script>
    <script src="../shared/core.js?v=2cdac465b4"></script>
    <script src="./icons.js?v=6a0dce9bfa"></script>
    <script src="./config.js?v=3704762329"></script>
    <script src="./card.js?v=2d4c943a58"></script>
  </head>

  <body>
    <div id="row" class="row" hidden></div>
    <div id="hint" class="zone-hint"></div>

    <!-- One card; cloned once per measure on the Measures tile. -->
    <template id="card-template">
      <div class="card is-empty">
        <div class="head">
          <div data-el="icon" class="icon" aria-hidden="true"></div>
          <div data-el="title" class="title"></div>
          <div data-el="explanation" class="explanation"></div>
        </div>

        <div class="metric">
          <div data-el="metric-row" class="metric-row">
            <div data-el="number" class="number">
              <span data-el="unit-pre" class="unit unit--pre"></span><span data-el="value" class="value"></span><span data-el="unit-post" class="unit unit--post"></span>
            </div>
            <div data-el="change" class="change" hidden>
              <span data-el="change-arrow" class="change-arrow"></span><span data-el="change-text" class="change-text"></span>
            </div>
          </div>
        </div>

        <div data-el="bottom" class="bottom">
          <svg data-el="chart" class="chart" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div data-el="bottom-text" class="bottom-text"></div>
        </div>

        <div data-el="hint" class="hint"></div>
      </div>
    </template>

    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <script>
      // boot.js loads the Tableau API library (and the dev mock with ?mock), then starts the extension.
      if (window.ExtBoot) {
        ExtBoot.start(function () { if (!window.KpiCardMulti) return false; window.KpiCardMulti.init(); return true; });
      } else {
        // boot.js itself did not arrive: reload this frame, up to 3 times.
        (function () {
          var n = +((/extRetry=(\d+)/.exec(location.hash) || [0, 0])[1]);
          if (n < 3) { location.hash = 'extRetry=' + (n + 1); location.reload(); }
          else document.getElementById('hint').textContent = 'Could not load the KPI Card Multi files. Refresh the page to try again.';
        })();
      }
    </script>
  </body>
</html>
