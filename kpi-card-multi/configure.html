<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI Card Multi — Format</title>
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="../shared/dialog.css?v=89b219bfe8" />
    <link rel="stylesheet" href="./configure.css?v=6b17f7215d" />
  </head>

  <body>
    <header class="picker" id="picker"></header>
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="body" id="panels"></main>

    <footer class="footer">
      <button class="btn" id="reset-tab" type="button" title="Restore Figma defaults for this tab">Reset tab</button>
      <button class="btn" id="apply-all" type="button" title="Copy this card's settings on this tab to every card" hidden>Apply to all</button>
      <span class="status" id="status"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="done" type="button">Done</button>
    </footer>

    <script src="../shared/boot.js?v=274c7f0929" data-lib="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" data-mock="./dev/mock.js?v=16db0ca26c" data-name="KPI Card Multi — Format" data-ext-version="1.2.0"></script>
    <script src="../shared/core.js?v=2cdac465b4"></script>
    <script src="../shared/theme.js?v=cbd846f937"></script>
    <script src="../shared/dialog.js?v=18c830d481"></script>
    <script src="./icons.js?v=6a0dce9bfa"></script>
    <script src="./config.js?v=da76530222"></script>
    <script src="./configure.js?v=9ddb89e3fe"></script>
    <script>
      if (window.ExtBoot) {
        ExtBoot.start(function () { if (!window.KpiCardMultiConfigure) return false; window.KpiCardMultiConfigure.init(); return true; }, { dialog: true });
      } else {
        console.error('Could not load the KPI Card Multi files.');
      }
    </script>
  </body>
</html>
