<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI Card Multi — Format</title>
    <script>
      // Dev preview only (dev/preview.html): a stand-in for Tableau when the URL has ?mock.
      if (/[?&]mock\b/.test(location.search)) document.write('<script src="./dev/mock.js?v=cd118f577f"><\/script>');
    </script>
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./configure.css?v=354e3c385c" />
  </head>

  <body>
    <header class="picker" id="picker"></header>
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="body" id="panels"></main>

    <footer class="footer">
      <button class="btn" id="reset-tab" type="button" title="Restore Figma defaults for this tab">Reset tab</button>
      <button class="btn" id="apply-all" type="button" title="Copy this card's settings on this tab to every card" hidden>Apply to all</button>
      <span class="status" id="status"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="done" type="button">Done</button>
    </footer>

    <script src="./icons.js?v=6a0dce9bfa"></script>
    <script src="./config.js?v=dac91709ac"></script>
    <script src="./configure.js?v=d8eee750ac"></script>
    <script>
      // Tableau Extensions API is bundled in ./lib (no CDN). Skipped when a dev mock already defined it.
      if (!(window.tableau && window.tableau.extensions)) {
        document.write('<script src="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7"><\/script>');
      }
    </script>
    <script>
      if (window.tableau && window.tableau.extensions) {
        window.KpiCardMultiConfigure.init();
      } else {
        console.error('Could not load the Tableau Extensions API library.');
      }
    </script>
  </body>
</html>
