<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matrix Table</title>
    <!-- Start-up, reload recovery and error reporting (shared/boot.js). -->
    <script src="../shared/boot.js?v=274c7f0929" data-lib="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" data-mock="./dev/mock.js?v=f14c076606" data-name="Matrix" data-ext-version="1.1.0"></script>
    <!-- Start downloading the shared Tableau API library early; the same URL is cached for every extension. -->
    <link rel="preload" as="script" href="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" />
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./chart.css?v=532ffe946c" />
    <script src="../shared/timing.js?v=666dc99b7c"></script>
    <script src="../shared/core.js?v=2cdac465b4"></script>
    <script src="./icons.js?v=899a3f9c7f"></script>
    <script src="./config.js?v=d4e607428a"></script>
    <script src="./export.js?v=dfae6446a4"></script>
    <script src="./chart.js?v=4d5a7938a9"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div class="head">
        <div id="icon" class="icon" aria-hidden="true"></div>
        <div id="title" class="title"></div>
        <div id="explanation" class="explanation"></div>
      </div>

      <div id="tools" class="tools">
        <button id="exportBtn" class="tool-btn" type="button" title="Export to Excel or CSV" aria-label="Export">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L4.8 6.8M8 10l3.2-3.2M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div id="body" class="body">
        <div id="plot" class="plot">
          <div id="scroll" class="scroll" role="region" aria-label="Matrix table"></div>
        </div>
      </div>

      <div id="hint" class="hint"></div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>
    <div id="menu" class="menu" role="menu"></div>
    <div id="toast" class="toast" role="status"></div>

    <script>
      // boot.js loads the Tableau API library (and the dev mock with ?mock), then starts the extension.
      if (window.ExtBoot) {
        ExtBoot.start(function () { if (!window.MatrixTable) return false; window.MatrixTable.init(); return true; });
      } else {
        // boot.js itself did not arrive: reload this frame, up to 3 times.
        (function () {
          var n = +((/extRetry=(\d+)/.exec(location.hash) || [0, 0])[1]);
          if (n < 3) { location.hash = 'extRetry=' + (n + 1); location.reload(); }
          else document.getElementById('hint').textContent = 'Could not load the Matrix files. Refresh the page to try again.';
        })();
      }
    </script>
  </body>
</html>
