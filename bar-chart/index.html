<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bar Chart</title>
    <!-- Start-up, reload recovery and error reporting (shared/boot.js). -->
    <script src="../shared/boot.js?v=274c7f0929" data-lib="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" data-mock="./dev/mock.js?v=c942f59f0f" data-name="Bar Chart" data-ext-version="1.2.0"></script>
    <!-- Start downloading the shared Tableau API library early; the same URL is cached for every extension. -->
    <link rel="preload" as="script" href="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" />
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./chart.css?v=f755dc81cb" />
    <script src="../shared/timing.js?v=666dc99b7c"></script>
    <script src="../shared/core.js?v=2cdac465b4"></script>
    <script src="../shared/snapshot.js?v=b026331aa7"></script>
    <script src="./icons.js?v=58c76ce58f"></script>
    <script src="./config.js?v=57702040e2"></script>
    <script src="./export.js?v=d7e1e93f71"></script>
    <script src="./chart-state.js?v=83dc9a01e3"></script>
    <script src="./chart-data.js?v=fa22554552"></script>
    <script src="./chart-layout.js?v=94bf7db6b6"></script>
    <script src="./chart-card.js?v=07f27453f8"></script>
    <script src="./chart-draw.js?v=32861a5793"></script>
    <script src="./chart-interact.js?v=b4c93e6dd4"></script>
    <script src="./chart.js?v=4655b58450"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div class="head">
        <div id="icon" class="icon" aria-hidden="true"></div>
        <div id="title" class="title"></div>
        <div id="explanation" class="explanation"></div>
      </div>

      <div id="drillbar" class="drillbar"></div>

      <div id="body" class="body legend-top">
        <div id="legend" class="legend"></div>
        <div id="plot" class="plot">
          <svg id="svg" class="svg" role="img" aria-label="Bar chart"></svg>
        </div>
      </div>

      <div id="hint" class="hint"></div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>
    <div id="menu" class="menu" role="menu"></div>
    <div id="note" class="note-editor"></div>

    <script>
      // boot.js loads the Tableau API library (and the dev mock with ?mock), then starts the extension.
      if (window.ExtBoot) {
        ExtBoot.start(function () { if (!window.BarChart) return false; window.BarChart.init(); return true; });
      } else {
        // boot.js itself did not arrive: reload this frame, up to 3 times.
        (function () {
          var n = +((/extRetry=(\d+)/.exec(location.hash) || [0, 0])[1]);
          if (n < 3) { location.hash = 'extRetry=' + (n + 1); location.reload(); }
          else document.getElementById('hint').textContent = 'Could not load the Bar Chart files. Refresh the page to try again.';
        })();
      }
    </script>
  </body>
</html>
