<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Lineage</title>
    <script>
      // Automatic recovery: if a file doesn't arrive, Tableau rejects the handshake, or the handshake
      // isn't answered in time (see INIT_TIMEOUT in the main JS), reload this frame, up to 3 times.
      // The count rides in the URL hash.
      (function () {
        var m = /extRetry=(\d+)/.exec(location.hash);
        var n = m ? +m[1] : 0;
        var base = location.pathname + location.search;
        var pending = 0;
        function go (k) {
          try { history.replaceState(null, '', base + (k ? '#extRetry=' + k : '')); } catch (e) { /* ignore */ }
          location.reload();
        }
        window.ExtBoot = {
          attempt: n,
          retry: function (why) {
            if (pending) return true;
            if (n >= 3) return false;
            console.warn('Data Lineage: ' + why + ', reloading (attempt ' + (n + 1) + ' of 3)');
            pending = setTimeout(function () { go(n + 1); }, 200 + Math.random() * 1300);
            return true;
          },
          reload: function () { go(0); },
          ok: function () {
            clearTimeout(pending);
            pending = 0;
            if (n) { try { history.replaceState(null, '', base); } catch (e) { /* ignore */ } }
          }
        };
      })();
    </script>
    <!-- Start downloading the shared Tableau API library early; the same URL is cached for every extension. -->
    <link rel="preload" as="script" href="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7" />
    <link rel="stylesheet" href="../shared/fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./chart.css?v=4e45e46243" />
    <script src="../shared/timing.js?v=666dc99b7c"></script>
    <script src="./icons.js?v=58c76ce58f"></script>
    <script src="./config.js?v=6abc19bbb5"></script>
    <script src="./chart.js?v=d7a96fe2ca"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div class="topbar">
        <div class="head">
          <div id="icon" class="icon" aria-hidden="true"></div>
          <div id="title" class="title"></div>
          <div id="explanation" class="explanation"></div>
        </div>
        <div id="tools" class="tools">
          <div id="legend" class="legend"></div>
          <div id="searchbox" class="searchbox">
            <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Search nodes" />
          </div>
        </div>
      </div>

      <div id="legendrow" class="legendrow"></div>

      <div id="plot" class="plot">
        <div id="headers" class="headers"></div>
        <div id="canvas" class="canvas">
          <svg id="svg" class="svg" role="img" aria-label="Data lineage"></svg>
          <div id="nodes" class="nodes"></div>
        </div>
      </div>

      <div id="hint" class="hint"></div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>
    <div id="menu" class="menu" role="menu"></div>

    <script>
      // Dev preview only: index.html?mock loads a stand-in for the Tableau API.
      if (/[?&]mock\b/.test(location.search)) document.write('<script src="./dev/mock.js?v=83db694214"><\/script>');
    </script>
    <script>
      // Tableau Extensions API is bundled in ./lib (no CDN). Skipped when a dev mock already defined it.
      if (!(window.tableau && window.tableau.extensions)) {
        document.write('<script src="../shared/lib/tableau.extensions.1.17.0.min.js?v=276479f2c7"><\/script>');
      }
    </script>
    <script>
      if (window.ExtTiming) ExtTiming.mark('Tableau API library loaded');
      if (window.tableau && window.tableau.extensions && window.DataLineage) {
        window.DataLineage.init();
      } else if (!window.ExtBoot.retry('a file did not load')) {
        document.getElementById('hint').textContent =
            'Could not load the Data Lineage files. Refresh the page to try again.';
      }
    </script>
  </body>
</html>
